name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" && break
            sleep 1
          done

      - name: Prepare test database
        env:
          APP_SECRET: testsecret
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/app_test
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:schema:update --env=test --force

      - name: Load test fixtures
        env:
          APP_SECRET: testsecret
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/app_test
        run: php bin/console doctrine:fixtures:load --env=test --group=test --no-interaction

      - name: Run PHPUnit
        env:
          APP_SECRET: testsecret
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/app_test
        run: vendor/bin/phpunit --display-warnings=0 --display-deprecations=0
