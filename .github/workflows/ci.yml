name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create .env.test
        run: |
          echo "APP_ENV=test" > .env.test
          echo "APP_SECRET=testsecret" >> .env.test
          echo "DATABASE_URL=\"mysql://root:root@127.0.0.1:3306/test_db_test?serverVersion=8.0\"" >> .env.test

      - name: Debug env
        run: |
          echo "From shell:"
          echo "$DATABASE_URL"
          echo
          echo "From PHP getenv():"
          php -r "echo getenv('DATABASE_URL') . PHP_EOL;"
          echo
          echo "From Symfony container (test env):"
          php bin/console debug:container --env=test | grep DATABASE_URL || true

      - name: Prepare database
        run: |
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:schema:create --env=test
          php bin/console doctrine:fixtures:load --no-interaction --env=test

      - name: Run tests
        run: vendor/bin/phpunit --display-warnings=0
