security:
    enable_authenticator_manager: true

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                always_use_default_target_path: true
                default_target_path: admin_album_index

            logout:
                path: app_logout

    role_hierarchy:
        ROLE_INA: ROLE_USER

    access_control:
        # Accès réservé à Ina
        - { path: ^/admin, roles: ROLE_INA }

        # Accès aux médias (tous les utilisateurs connectés)
        - { path: ^/media, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
