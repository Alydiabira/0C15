security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
      algorithm: auto

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    admin:
      pattern: ^/admin
      provider: app_user_provider
      lazy: true

      # Désactive http_basic (sinon Symfony le compte comme un 2e authenticator)
      http_basic: false

      # Un SEUL authenticator
      custom_authenticator:
        - App\Security\AdminAuthenticator

      # Obligatoire car il n’y a qu’un authenticator
      entry_point: App\Security\AdminAuthenticator

      logout:
        path: app_logout
        target: /

    main:
      pattern: ^/
      provider: app_user_provider
      lazy: true

      custom_authenticator:
        - App\Security\AppAuthenticator

      remember_me:
        secret: "%kernel.secret%"
        lifetime: 604800
        path: /

      logout:
        path: app_logout
        target: /

  role_hierarchy:
    ROLE_INA: ROLE_USER

  access_control:
    - { path: ^/admin/login, roles: PUBLIC_ACCESS }
    - { path: ^/admin, roles: ROLE_INA }
    - { path: ^/guest, roles: ROLE_USER }
