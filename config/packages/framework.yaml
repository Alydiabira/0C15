framework:
  secret: "%env(APP_SECRET)%"
  handle_all_throwables: true

  annotations:
    enabled: false

  http_method_override: false

  session:
    enabled: true
    handler_id: null
    cookie_secure: auto
    cookie_samesite: lax
    storage_factory_id: session.storage.factory.native

  php_errors:
    log: true

when@test:
  framework:
    test: true
    session:
      enabled: true
      handler_id: null
      storage_factory_id: session.storage.factory.mock_file
